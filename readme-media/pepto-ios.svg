<svg xmlns="http://www.w3.org/2000/svg" width="420" height="860" viewBox="0 0 420 860" font-family="-apple-system,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="hero" x1="0" y1="0" x2="380" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E2956B"/><stop offset="1" stop-color="#C1453B"/>
    </linearGradient>
    <clipPath id="screen2"><rect x="20" y="20" width="380" height="820" rx="46"/></clipPath>
  </defs>

  <!-- phone body -->
  <rect x="6" y="6" width="408" height="848" rx="58" fill="#0E0E12"/>
  <rect x="20" y="20" width="380" height="820" rx="46" fill="#FFFFFF"/>

  <g clip-path="url(#screen2)">
    <g transform="translate(20,20)">
      <!-- hero food image -->
      <path d="M0,0 H380 V300 H0 Z" fill="url(#hero)"/>
      <!-- status bar -->
      <text x="28" y="34" fill="#FFFFFF" font-size="13" font-weight="700">9:41</text>
      <rect x="330" y="22" width="22" height="11" rx="3" fill="none" stroke="#FFFFFF" stroke-width="1.5"/><rect x="332" y="24" width="14" height="7" rx="1" fill="#FFFFFF"/>
      <!-- back & heart -->
      <circle cx="44" cy="80" r="18" fill="#000000" opacity="0.35"/><path d="M48,72 l-7,8 l7,8" fill="none" stroke="#FFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="336" cy="80" r="18" fill="#000000" opacity="0.35"/><path d="M336,87 c-5,-4 -9,-6 -9,-11 a4.5,4.5 0 0 1 9,-1 a4.5,4.5 0 0 1 9,1 c0,5 -4,7 -9,11 z" fill="none" stroke="#FFF" stroke-width="2"/>

      <!-- content -->
      <text x="20" y="344" fill="#1C1C1E" font-size="23" font-weight="800">Spice Garden</text>
      <text x="20" y="368" fill="#9A9AA2" font-size="13">North Indian • Chinese</text>

      <!-- rating row -->
      <rect x="20" y="384" width="48" height="22" rx="6" fill="#267E3E"/><text x="29" y="399" fill="#FFF" font-size="12" font-weight="700">4.3 ★</text>
      <text x="78" y="399" fill="#9A9AA2" font-size="12">1.2K ratings</text>
      <text x="168" y="399" fill="#267E3E" font-size="12" font-weight="800">PURE VEG</text>

      <!-- info strip -->
      <rect x="20" y="418" width="340" height="72" rx="16" fill="#FFFFFF" stroke="#ECECEE" stroke-width="1.5"/>
      <g text-anchor="middle">
        <text x="76" y="448" font-size="18">⏱</text><text x="76" y="468" fill="#1C1C1E" font-size="12" font-weight="700">30-37 min</text><text x="76" y="483" fill="#9A9AA2" font-size="10">Delivery</text>
        <line x1="133" y1="436" x2="133" y2="472" stroke="#ECECEE" stroke-width="1.5"/>
        <text x="190" y="448" font-size="18">📍</text><text x="190" y="468" fill="#1C1C1E" font-size="12" font-weight="700">1.2 km</text><text x="190" y="483" fill="#9A9AA2" font-size="10">Distance</text>
        <line x1="247" y1="436" x2="247" y2="472" stroke="#ECECEE" stroke-width="1.5"/>
        <text x="304" y="448" font-size="18">💳</text><text x="304" y="468" fill="#1C1C1E" font-size="12" font-weight="700">350</text><text x="304" y="483" fill="#9A9AA2" font-size="10">₹ for two</text>
      </g>

      <!-- offer banner -->
      <rect x="20" y="504" width="340" height="58" rx="12" fill="#FDF1DA"/>
      <text x="38" y="540" font-size="20">🏷️</text>
      <text x="64" y="532" fill="#1C1C1E" font-size="13" font-weight="700">50% OFF up to ₹100</text>
      <text x="64" y="550" fill="#9A9AA2" font-size="11">Apply at checkout</text>

      <!-- about -->
      <text x="20" y="600" fill="#1C1C1E" font-size="18" font-weight="800">About</text>
      <text x="20" y="622" fill="#FF7E5F" font-size="11" font-weight="700">~ by Chef Arai</text>
      <g fill="#E6E6EA">
        <rect x="20" y="634" width="340" height="11" rx="5"/>
        <rect x="20" y="652" width="340" height="11" rx="5"/>
        <rect x="20" y="670" width="300" height="11" rx="5"/>
        <rect x="20" y="688" width="330" height="11" rx="5"/>
      </g>
    </g>
  </g>

  <!-- add to cart bar (inside screen, above home indicator) -->
  <g clip-path="url(#screen2)">
    <rect x="20" y="752" width="380" height="88" fill="#FFFFFF"/>
    <line x1="20" y1="752" x2="400" y2="752" stroke="#ECECEE" stroke-width="1"/>
    <text x="40" y="784" fill="#9A9AA2" font-size="11">Total</text>
    <text x="40" y="806" fill="#1C1C1E" font-size="19" font-weight="800">₹350</text>
    <rect x="226" y="772" width="158" height="44" rx="12" fill="#E23744"/>
    <text x="305" y="800" fill="#FFFFFF" font-size="14" font-weight="700" text-anchor="middle">🛒  Add to cart</text>
    <!-- home indicator -->
    <rect x="160" y="824" width="100" height="5" rx="2.5" fill="#1C1C1E" opacity="0.25"/>
  </g>

  <!-- dynamic island -->
  <rect x="160" y="32" width="100" height="26" rx="13" fill="#0E0E12"/>
</svg>
