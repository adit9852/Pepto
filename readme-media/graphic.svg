<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="640" viewBox="0 0 1280 640" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="640" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E23744"/><stop offset="1" stop-color="#FF7E5F"/>
    </linearGradient>
    <linearGradient id="hdrG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E23744"/><stop offset="1" stop-color="#FF7E5F"/></linearGradient>
    <linearGradient id="fa" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFB36B"/><stop offset="1" stop-color="#FF7E5F"/></linearGradient>
    <linearGradient id="fb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7BC67E"/><stop offset="1" stop-color="#4E9D5B"/></linearGradient>
    <linearGradient id="fc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#C46A5B"/><stop offset="1" stop-color="#E2956B"/></linearGradient>
    <clipPath id="clipA"><rect x="705" y="80" width="230" height="500" rx="32"/></clipPath>
    <clipPath id="clipB"><rect x="960" y="110" width="230" height="500" rx="36"/></clipPath>

    <!-- reusable Pepto home screen (local 230 x 500) -->
    <g id="home">
      <rect width="230" height="500" fill="#F6F6F8"/>
      <path d="M0,0 H230 V76 Q230,92 214,92 H16 Q0,92 0,76 Z" fill="url(#hdrG)"/>
      <rect x="10" y="12" width="20" height="20" rx="6" fill="#FFFFFF"/>
      <g transform="translate(13,15) scale(0.55)" fill="#E23744"><path d="M11,9H9V2H7v7H5V2H3v7c0,2.12 1.66,3.84 3.75,3.97V22h2.5v-9.03C11.34,12.84 13,11.12 13,9V2h-2v7zM16,6v8h2.5v8H21V2c-2.76,0 -5,2.24 -5,4z"/></g>
      <text x="36" y="28" fill="#FFFFFF" font-size="14" font-weight="800">Pepto</text>
      <circle cx="212" cy="22" r="10" fill="#FFFFFF" opacity="0.25"/>
      <text x="12" y="52" fill="#FFFFFF" opacity="0.85" font-size="8">Deliver to ▾</text>
      <text x="12" y="68" fill="#FFFFFF" font-size="10" font-weight="700">📍 Koramangala</text>
      <rect x="10" y="102" width="210" height="30" rx="9" fill="#FFFFFF"/>
      <circle cx="26" cy="117" r="5" fill="none" stroke="#E23744" stroke-width="1.5"/>
      <text x="40" y="121" fill="#9A9AA2" font-size="9">Search for dishes...</text>
      <g text-anchor="middle">
        <circle cx="30" cy="158" r="14" fill="#FBE3E5"/><text x="30" y="163" font-size="12">🍕</text>
        <circle cx="71" cy="158" r="14" fill="#FBE3E5"/><text x="71" y="163" font-size="12">🍔</text>
        <circle cx="112" cy="158" r="14" fill="#FBE3E5"/><text x="112" y="163" font-size="12">🍜</text>
        <circle cx="153" cy="158" r="14" fill="#FBE3E5"/><text x="153" y="163" font-size="12">🍱</text>
        <circle cx="194" cy="158" r="14" fill="#FBE3E5"/><text x="194" y="163" font-size="12">☕</text>
      </g>
      <text x="10" y="200" fill="#1C1C1E" font-size="11" font-weight="800">Popular near you</text>
      <g transform="translate(10,208)">
