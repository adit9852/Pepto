      <rect x="0" y="470" width="230" height="30" fill="#FFFFFF"/>
      <line x1="0" y1="470" x2="230" y2="470" stroke="#ECECEE" stroke-width="1"/>
      <path d="M24,487 l6,-5 l6,5 v5 h-12 z" fill="#E23744"/>
      <circle cx="88" cy="485" r="4.5" fill="none" stroke="#9A9AA2" stroke-width="1.5"/>
      <rect x="143" y="481" width="11" height="11" rx="2" fill="none" stroke="#9A9AA2" stroke-width="1.5"/>
      <circle cx="200" cy="483" r="3.5" fill="none" stroke="#9A9AA2" stroke-width="1.5"/><path d="M194,492 a6,5 0 0 1 12,0 z" fill="none" stroke="#9A9AA2" stroke-width="1.5"/>
    </g>
  </defs>

  <!-- background -->
  <rect width="1280" height="640" fill="url(#bg)"/>
  <circle cx="120" cy="540" r="240" fill="#FFFFFF" opacity="0.06"/>
  <circle cx="1180" cy="60" r="180" fill="#FFFFFF" opacity="0.06"/>

  <!-- left text block -->
  <g transform="translate(90,150)">
    <rect x="0" y="0" width="92" height="92" rx="26" fill="#FFFFFF"/>
    <g transform="translate(20,20) scale(2.2)" fill="#E23744"><path d="M11,9H9V2H7v7H5V2H3v7c0,2.12 1.66,3.84 3.75,3.97V22h2.5v-9.03C11.34,12.84 13,11.12 13,9V2h-2v7zM16,6v8h2.5v8H21V2c-2.76,0 -5,2.24 -5,4z"/></g>
    <text x="112" y="68" fill="#FFFFFF" font-size="86" font-weight="800" letter-spacing="-3">Pepto</text>
    <text x="4" y="150" fill="#FFFFFF" font-size="34" font-weight="700" opacity="0.97">Food delivery, reimagined.</text>
    <text x="4" y="196" fill="#FFFFFF" font-size="21" font-weight="500" opacity="0.88">One Kotlin Multiplatform codebase. One Compose UI.</text>
    <g fill="#FFFFFF" font-size="20" font-weight="600" opacity="0.95">
      <text x="4" y="252">✓  Modern, aesthetic food‑delivery UI</text>
      <text x="4" y="288">✓  Shared across Android &amp; iOS</text>
      <text x="4" y="324">✓  Offline cache · Dark mode</text>
    </g>
    <g transform="translate(4,352)">
      <rect width="138" height="42" rx="21" fill="#FFFFFF" opacity="0.2"/>
      <text x="69" y="28" fill="#FFFFFF" font-size="18" font-weight="800" text-anchor="middle">ANDROID</text>
      <rect x="154" width="92" height="42" rx="21" fill="#FFFFFF" opacity="0.2"/>
      <text x="200" y="28" fill="#FFFFFF" font-size="18" font-weight="800" text-anchor="middle">iOS</text>
    </g>
  </g>

  <!-- phone A : Android -->
  <rect x="695" y="70" width="250" height="520" rx="40" fill="#0E0E12"/>
  <g clip-path="url(#clipA)"><use xlink:href="#home" x="705" y="80"/></g>
  <circle cx="820" cy="94" r="4" fill="#0E0E12"/>
  <g transform="translate(820,612)"><rect x="-44" y="-20" width="88" height="34" rx="17" fill="#0E0E12" opacity="0.85"/><text x="0" y="2" fill="#FFFFFF" font-size="16" font-weight="700" text-anchor="middle">Android</text></g>

  <!-- phone B : iOS -->
  <rect x="950" y="110" width="250" height="520" rx="44" fill="#0E0E12"/>
  <g clip-path="url(#clipB)"><use xlink:href="#home" x="960" y="110"/></g>
  <rect x="1045" y="122" width="60" height="16" rx="8" fill="#0E0E12"/>
  <g transform="translate(1075,648)"><rect x="-34" y="-20" width="68" height="34" rx="17" fill="#0E0E12" opacity="0.85"/><text x="0" y="2" fill="#FFFFFF" font-size="16" font-weight="700" text-anchor="middle">iOS</text></g>
</svg>
