    <rect x="148" y="0" width="92" height="40" rx="20" fill="#FFFFFF" opacity="0.18"/>
    <text x="194" y="26" fill="#FFFFFF" font-size="18" font-weight="700" text-anchor="middle">iOS</text>
  </g>
</svg>
