        <path d="M0,10 Q0,0 10,0 H92 Q102,0 102,10 V54 H0 Z" fill="url(#fa)"/>
        <rect x="6" y="38" width="32" height="14" rx="4" fill="#267E3E"/><text x="10" y="49" fill="#FFF" font-size="8" font-weight="700">4.5★</text>
        <text x="8" y="74" fill="#1C1C1E" font-size="9" font-weight="700">Tandoori Hub</text>
        <text x="8" y="86" fill="#9A9AA2" font-size="7">North Indian • 25 min</text>
      </g>
      <g transform="translate(118,208)">
        <rect width="102" height="94" rx="10" fill="#FFFFFF"/>
        <path d="M0,10 Q0,0 10,0 H92 Q102,0 102,10 V54 H0 Z" fill="url(#fb)"/>
        <rect x="6" y="38" width="32" height="14" rx="4" fill="#267E3E"/><text x="10" y="49" fill="#FFF" font-size="8" font-weight="700">4.7★</text>
        <text x="8" y="74" fill="#1C1C1E" font-size="9" font-weight="700">Green Bowl</text>
        <text x="8" y="86" fill="#9A9AA2" font-size="7">Healthy • 20 min</text>
      </g>
      <text x="10" y="326" fill="#1C1C1E" font-size="11" font-weight="800">All restaurants</text>
      <g transform="translate(10,334)">
