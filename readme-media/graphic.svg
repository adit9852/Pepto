        <path d="M0,12 Q0,0 12,0 H198 Q210,0 210,12 V70 H0 Z" fill="url(#fc)"/>
        <text x="8" y="62" fill="#FFFFFF" font-size="10" font-weight="800">50% OFF up to ₹100</text>
        <circle cx="196" cy="16" r="9" fill="#FFFFFF"/><path d="M196,20 c-2.5,-2 -4.5,-3 -4.5,-5.5 a2.2,2.2 0 0 1 4.5,-0.6 a2.2,2.2 0 0 1 4.5,0.6 c0,2.5 -2,3.5 -4.5,5.5 z" fill="#E23744"/>
        <text x="8" y="92" fill="#1C1C1E" font-size="11" font-weight="700">Spice Garden</text>
        <rect x="168" y="80" width="36" height="16" rx="5" fill="#267E3E"/><text x="174" y="92" fill="#FFF" font-size="9" font-weight="700">4.3★</text>
        <text x="8" y="108" fill="#9A9AA2" font-size="8">North Indian • Chinese</text>
        <text x="8" y="123" fill="#FF7E5F" font-size="8" font-weight="700">⏱ 30m   📍 1.2km   • ₹350</text>
