<svg xmlns="http://www.w3.org/2000/svg" width="420" height="860" viewBox="0 0 420 860" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="380" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E23744"/><stop offset="1" stop-color="#FF7E5F"/>
    </linearGradient>
    <linearGradient id="f1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFB36B"/><stop offset="1" stop-color="#FF7E5F"/></linearGradient>
    <linearGradient id="f2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7BC67E"/><stop offset="1" stop-color="#4E9D5B"/></linearGradient>
    <linearGradient id="f3" x1="0" y1="0" x2="380" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#C46A5B"/><stop offset="1" stop-color="#E2956B"/></linearGradient>
    <clipPath id="screen"><rect x="20" y="20" width="380" height="820" rx="38"/></clipPath>
  </defs>

  <!-- phone body -->
  <rect x="6" y="6" width="408" height="848" rx="54" fill="#0E0E12"/>
  <rect x="20" y="20" width="380" height="820" rx="38" fill="#F6F6F8"/>

  <g clip-path="url(#screen)">
    <g transform="translate(20,20)">
      <!-- header -->
      <path d="M0,0 H380 V124 Q380,150 354,150 H26 Q0,150 0,124 Z" fill="url(#hdr)"/>
      <!-- logo badge + wordmark -->
      <rect x="16" y="20" width="30" height="30" rx="9" fill="#FFFFFF"/>
      <g transform="translate(21,25) scale(0.83)" fill="#E23744">
        <path d="M11,9H9V2H7v7H5V2H3v7c0,2.12 1.66,3.84 3.75,3.97V22h2.5v-9.03C11.34,12.84 13,11.12 13,9V2h-2v7zM16,6v8h2.5v8H21V2c-2.76,0 -5,2.24 -5,4z"/>
      </g>
      <text x="54" y="41" fill="#FFFFFF" font-size="20" font-weight="800">Pepto</text>
      <circle cx="314" cy="35" r="15" fill="#FFFFFF" opacity="0.22"/><circle cx="314" cy="35" r="6" fill="none" stroke="#FFFFFF" stroke-width="2"/>
      <circle cx="352" cy="35" r="15" fill="#FFFFFF" opacity="0.22"/><circle cx="352" cy="31" r="4.5" fill="#FFFFFF"/><path d="M345,44 a7,7 0 0 1 14,0 z" fill="#FFFFFF"/>
      <!-- location -->
      <text x="20" y="92" fill="#FFFFFF" opacity="0.85" font-size="11">Deliver to ▾</text>
      <text x="20" y="116" fill="#FFFFFF" font-size="15" font-weight="700">📍 Koramangala, Bengaluru</text>

      <!-- search bar -->
      <rect x="16" y="170" width="348" height="46" rx="12" fill="#FFFFFF"/>
      <circle cx="38" cy="193" r="7" fill="none" stroke="#E23744" stroke-width="2"/><line x1="43" y1="198" x2="48" y2="203" stroke="#E23744" stroke-width="2"/>
      <text x="60" y="198" fill="#9A9AA2" font-size="13">Search for restaurants, dishes...</text>

      <!-- categories -->
      <g font-size="10" fill="#6E6E73" text-anchor="middle">
        <circle cx="44" cy="252" r="24" fill="#FBE3E5"/><text x="44" y="257" font-size="18">🍕</text><text x="44" y="292">Pizza</text>
        <circle cx="112" cy="252" r="24" fill="#FBE3E5"/><text x="112" y="257" font-size="18">🍔</text><text x="112" y="292">Burger</text>
        <circle cx="180" cy="252" r="24" fill="#FBE3E5"/><text x="180" y="257" font-size="18">🍜</text><text x="180" y="292">Noodles</text>
        <circle cx="248" cy="252" r="24" fill="#FBE3E5"/><text x="248" y="257" font-size="18">🍱</text><text x="248" y="292">Thali</text>
        <circle cx="316" cy="252" r="24" fill="#FBE3E5"/><text x="316" y="257" font-size="18">☕</text><text x="316" y="292">Cafe</text>
      </g>

      <!-- popular near you -->
      <text x="16" y="328" fill="#1C1C1E" font-size="17" font-weight="800">Popular near you</text>
      <text x="16" y="346" fill="#9A9AA2" font-size="11">Trending spots this week</text>

      <!-- popular card 1 -->
      <g transform="translate(16,358)">
        <rect width="156" height="158" rx="16" fill="#FFFFFF"/>
        <path d="M0,16 Q0,0 16,0 H140 Q156,0 156,16 V96 H0 Z" fill="url(#f1)"/>
        <rect x="8" y="76" width="42" height="18" rx="5" fill="#267E3E"/><text x="14" y="89" fill="#FFF" font-size="10" font-weight="700">4.5 ★</text>
        <text x="12" y="120" fill="#1C1C1E" font-size="13" font-weight="700">Tandoori Hub</text>
        <text x="12" y="138" fill="#9A9AA2" font-size="10">North Indian • 25 min</text>
      </g>
      <!-- popular card 2 -->
      <g transform="translate(184,358)">
        <rect width="156" height="158" rx="16" fill="#FFFFFF"/>
        <path d="M0,16 Q0,0 16,0 H140 Q156,0 156,16 V96 H0 Z" fill="url(#f2)"/>
        <rect x="8" y="76" width="42" height="18" rx="5" fill="#267E3E"/><text x="14" y="89" fill="#FFF" font-size="10" font-weight="700">4.7 ★</text>
        <text x="12" y="120" fill="#1C1C1E" font-size="13" font-weight="700">Green Bowl</text>
        <text x="12" y="138" fill="#9A9AA2" font-size="10">Healthy • 20 min</text>
      </g>
      <!-- peeking 3rd card -->
      <rect x="352" y="358" width="156" height="158" rx="16" fill="#FFFFFF"/>
      <path d="M352,374 Q352,358 368,358 H492 V454 H352 Z" fill="url(#f1)"/>

      <!-- all restaurants -->
      <text x="16" y="552" fill="#1C1C1E" font-size="17" font-weight="800">All restaurants</text>
      <text x="16" y="570" fill="#9A9AA2" font-size="11">42 places delivering to you</text>

      <!-- restaurant card -->
      <g transform="translate(16,584)">
        <rect width="348" height="196" rx="18" fill="#FFFFFF"/>
        <path d="M0,18 Q0,0 18,0 H330 Q348,0 348,18 V110 H0 Z" fill="url(#f3)"/>
        <text x="14" y="98" fill="#FFFFFF" font-size="16" font-weight="800">50% OFF up to ₹100</text>
        <circle cx="324" cy="24" r="15" fill="#FFFFFF"/><path d="M324,30 c-4,-3 -7,-5 -7,-9 a3.5,3.5 0 0 1 7,-1 a3.5,3.5 0 0 1 7,1 c0,4 -3,6 -7,9 z" fill="#E23744"/>
        <text x="14" y="138" fill="#1C1C1E" font-size="15" font-weight="700">Spice Garden</text>
        <rect x="296" y="124" width="46" height="20" rx="6" fill="#267E3E"/><text x="304" y="138" fill="#FFF" font-size="11" font-weight="700">4.3 ★</text>
        <text x="14" y="158" fill="#9A9AA2" font-size="11">North Indian • Chinese</text>
        <text x="14" y="180" fill="#FF7E5F" font-size="11" font-weight="700">⏱ 30-37 min   📍 1.2 km   • ₹350 for two</text>
      </g>
    </g>
  </g>

  <!-- bottom nav (drawn over content, inside screen) -->
  <g clip-path="url(#screen)">
    <rect x="20" y="784" width="380" height="56" fill="#FFFFFF"/>
    <line x1="20" y1="784" x2="400" y2="784" stroke="#ECECEE" stroke-width="1"/>
    <g text-anchor="middle" font-size="9">
      <path d="M61,800 l9,-8 l9,8 v9 h-18 z" fill="#E23744"/><text x="70" y="828" fill="#E23744" font-weight="700">Home</text>
      <circle cx="161" cy="804" r="7" fill="none" stroke="#9A9AA2" stroke-width="2"/><line x1="166" y1="809" x2="171" y2="814" stroke="#9A9AA2" stroke-width="2"/><text x="161" y="828" fill="#9A9AA2">Search</text>
      <rect x="251" y="795" width="18" height="18" rx="3" fill="none" stroke="#9A9AA2" stroke-width="2"/><text x="260" y="828" fill="#9A9AA2">Orders</text>
      <circle cx="350" cy="800" r="5" fill="none" stroke="#9A9AA2" stroke-width="2"/><path d="M342,814 a8,7 0 0 1 16,0 z" fill="none" stroke="#9A9AA2" stroke-width="2"/><text x="350" y="828" fill="#9A9AA2">Profile</text>
    </g>
  </g>

  <!-- punch-hole camera -->
  <circle cx="210" cy="34" r="6" fill="#0E0E12"/>
</svg>
